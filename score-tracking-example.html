<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TuxRacer Score Tracking Example</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      min-height: 100vh;
      padding: 20px;
    }

    .container {
      max-width: 1200px;
      margin: 0 auto;
    }

    h1 {
      color: white;
      text-align: center;
      margin-bottom: 20px;
      text-shadow: 2px 2px 4px rgba(0,0,0,0.3);
    }

    .game-container {
      background: white;
      border-radius: 10px;
      overflow: hidden;
      box-shadow: 0 10px 30px rgba(0,0,0,0.3);
      margin-bottom: 20px;
    }

    #tux-racer {
      width: 100%;
      height: 600px;
      border: none;
      display: block;
    }

    .scoreboard {
      background: white;
      border-radius: 10px;
      padding: 20px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.3);
    }

    .scoreboard h2 {
      color: #667eea;
      margin-bottom: 15px;
    }

    .score-item {
      background: #f8f9fa;
      padding: 15px;
      margin-bottom: 10px;
      border-radius: 5px;
      border-left: 4px solid #667eea;
    }

    .score-item h3 {
      color: #333;
      margin-bottom: 10px;
      font-size: 16px;
    }

    .score-details {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
      gap: 10px;
    }

    .score-detail {
      display: flex;
      flex-direction: column;
    }

    .score-label {
      font-size: 12px;
      color: #666;
      text-transform: uppercase;
      margin-bottom: 5px;
    }

    .score-value {
      font-size: 18px;
      font-weight: bold;
      color: #333;
    }

    .status-completed {
      color: #28a745;
    }

    .status-aborted {
      color: #dc3545;
    }

    .no-scores {
      text-align: center;
      color: #999;
      padding: 40px;
      font-style: italic;
    }

    .instructions {
      background: rgba(255,255,255,0.9);
      border-radius: 10px;
      padding: 15px;
      margin-bottom: 20px;
      box-shadow: 0 5px 15px rgba(0,0,0,0.2);
    }

    .instructions h3 {
      color: #667eea;
      margin-bottom: 10px;
    }

    .instructions ul {
      margin-left: 20px;
      color: #333;
    }

    .instructions li {
      margin-bottom: 5px;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>🐧 TuxRacer Score Tracking Demo</h1>
    
    <div class="instructions">
      <h3>How to Play:</h3>
      <ul>
        <li>Use <strong>Arrow Keys</strong> or <strong>WASD</strong> to control Tux</li>
        <li>Collect herring (fish) for points</li>
        <li>Complete the course as fast as possible</li>
        <li>Press <strong>ESC</strong> to abort the race</li>
        <li>Press <strong>R</strong> to restart</li>
      </ul>
    </div>

    <div class="game-container">
      <iframe id="tux-racer" src="./index.html?course=bunny-hill"></iframe>
    </div>
    
    <div class="scoreboard">
      <h2>📊 Score History</h2>
      <div id="score-list">
        <div class="no-scores">Play a race to see your scores here!</div>
      </div>
    </div>
  </div>

  <script>
    const iframe = document.getElementById('tux-racer');
    const scoreList = document.getElementById('score-list');
    const scores = [];
    
    iframe.addEventListener('load', () => {
      const gameWindow = iframe.contentWindow;
      
      // Configure score tracking with callback
      gameWindow.TuxRacerScoreTracker.configure({
        onScoreSubmit: handleScore,
        logToConsole: true
      });

      // Also listen to events (alternative method)
      gameWindow.addEventListener('tuxracer:score', (event) => {
        console.log('Score event received:', event.detail);
      });
    });
    
    function handleScore(scoreData) {
      console.log('Score callback received:', scoreData);
      
      // Add to scores array
      scores.unshift(scoreData);
      
      // Keep only last 10 scores
      if (scores.length > 10) {
        scores.pop();
      }
      
      // Update display
      displayScores();
      
      // Simulate sending to backend
      simulateBackendSave(scoreData);
    }
    
    function displayScores() {
      if (scores.length === 0) {
        scoreList.innerHTML = '<div class="no-scores">Play a race to see your scores here!</div>';
        return;
      }
      
      scoreList.innerHTML = scores.map((score, index) => `
        <div class="score-item">
          <h3>Race #${scores.length - index}</h3>
          <div class="score-details">
            <div class="score-detail">
              <span class="score-label">Course</span>
              <span class="score-value">${formatCourseName(score.course)}</span>
            </div>
            <div class="score-detail">
              <span class="score-label">Time</span>
              <span class="score-value">${score.timeSeconds.toFixed(2)}s</span>
            </div>
            <div class="score-detail">
              <span class="score-label">Items</span>
              <span class="score-value">${score.itemsCollected} 🐟</span>
            </div>
            <div class="score-detail">
              <span class="score-label">Status</span>
              <span class="score-value ${score.completed ? 'status-completed' : 'status-aborted'}">
                ${score.completed ? '✓ Completed' : '✗ Aborted'}
              </span>
            </div>
          </div>
        </div>
      `).join('');
    }
    
    function formatCourseName(courseKey) {
      return courseKey
        .split('-')
        .map(word => word.charAt(0).toUpperCase() + word.slice(1))
        .join(' ');
    }
    
    function simulateBackendSave(scoreData) {
      // This simulates sending the score to your backend
      console.log('Simulating backend save...');
      console.log('POST /api/scores', JSON.stringify(scoreData, null, 2));
      
      // In a real app, you would do:
      /*
      fetch('/api/scores', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(scoreData)
      })
      .then(response => response.json())
      .then(data => console.log('Score saved to backend:', data))
      .catch(error => console.error('Error saving score:', error));
      */
    }
  </script>
</body>
</html>
